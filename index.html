<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>world.execute(me); — ChatGPT 中文版预览</title>
<style>
  html, body { margin: 0; background: #07130f; color: #c9e5d9; font: 500 13px/1.5 "Noto Sans SC", Consolas, "JetBrains Mono", sans-serif; }
  body.export { background: #000; overflow: hidden; }
  body.export #ui, body.export #loading { display: none; }
  #wrap { max-width: 980px; margin: 18px auto; padding: 0 10px; }
  #stage { position: relative; }
  canvas#view { display: block; box-sizing: border-box; width: 100%; max-width: 960px; height: auto; aspect-ratio: 16 / 9; background: #000; border: 1px solid #24513f; }
  body.export canvas#view { border: 0; width: auto; height: auto; max-width: none; aspect-ratio: auto; }
  /* shown over the picture until the first frame is drawn (src/main.js: boot) */
  #loading { position: absolute; inset: 0; max-width: 960px; display: flex; align-items: center; justify-content: center; background: #07130f; border: 1px solid #24513f; box-sizing: border-box; }
  #loading[hidden] { display: none; }
  #loadBox { width: min(420px, 80%); }
  #loadTitle { color: #edfff6; margin-bottom: 10px; }
  #loadTitle span { color: #72bda1; }
  #loadBar { height: 4px; background: #12251e; border: 1px solid #24513f; }
  #loadFill { display: block; height: 100%; width: 0; background: #10a37f; transition: width 0.12s linear; }
  #loadText { margin-top: 8px; color: #72bda1; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #loading.failed #loadFill { background: #e8788f; }
  #loading.failed #loadText { color: #e8788f; white-space: normal; }
  #bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  #seek { flex: 1; accent-color: #10a37f; }
  button { background: #12251e; color: #edfff6; border: 1px solid #24513f; padding: 5px 14px; font: inherit; cursor: pointer; min-width: 74px; }
  button:hover { border-color: #10a37f; }
  button:disabled { color: #557969; border-color: #24513f; cursor: default; }
  #info { margin-top: 8px; display: grid; grid-template-columns: 150px 1fr; gap: 2px 12px; }
  #info b { color: #72bda1; font-weight: normal; }
  #info .warn { color: #e8b478; }
  #help { margin-top: 10px; color: #769587; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="loading">
      <div id="loadBox">
        <div id="loadTitle">world.execute(me); <span>— ChatGPT 中文特别版</span></div>
        <div id="loadBar"><i id="loadFill"></i></div>
        <div id="loadText">config.json</div>
      </div>
    </div>
  </div>
  <div id="ui">
    <div id="bar">
      <button id="play" disabled>播放</button>
      <input id="seek" type="range" min="0" max="1" step="0.001" value="0">
      <span id="clock">00:00.000</span>
    </div>
    <div id="info">
      <b>歌曲时间 / 帧数</b><span id="iT">-</span>
      <b>当前歌词</b><span id="iLine">-</span>
      <b>拍点 / 小节</b><span id="iBeat">-</span>
      <b>镜头 / 色彩状态</b><span id="iScene">-</span>
      <b>画面段落</b><span id="iMoment">-</span>
      <b>音频状态</b><span id="iAudio">-</span>
      <b>渲染状态</b><span id="iPerf">-</span>
    </div>
    <div id="help">空格：播放／暂停 · ←／→：前后跳转 1 秒 · Shift + ←／→：前后跳转 5 秒 · 逗号／句号：逐帧移动 · 地址末尾添加 ?t=12.5 可跳转到歌曲第 12.5 秒（歌曲前的警告画面使用负时间）</div>
    <audio id="audio" preload="auto"></audio>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
